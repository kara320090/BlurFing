name: Demo handoff synthetic contracts
on:
  push:
    branches: [main]
    paths: ['demo/**', 'backend/experimental_photo_transport_v2.py', '.github/workflows/demo-contracts.yml']
  pull_request:
    paths: ['demo/**', 'backend/experimental_photo_transport_v2.py', '.github/workflows/demo-contracts.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -r ai/requirements.txt -r backend/requirements-photo-v2.txt -r backend/requirements-dev.txt
      - run: python -m pytest demo/test_demo.py -q
