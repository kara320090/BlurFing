worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/null;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    default_type application/json;
    server_tokens off;
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Origin ports are loopback-only. The dedicated tunnel network is trusted;
    # never publish this port to the LAN/Internet while trusting these headers.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    map $request_method $post_client { default ""; POST $binary_remote_addr; }
    map $request_method $post_global { default ""; POST "protection"; }
    limit_req_zone $post_client zone=per_client:1m rate=6r/m;
    limit_req_zone $post_global zone=global_requests:1m rate=30r/m;
    limit_conn_zone $binary_remote_addr zone=client_connections:1m;
    limit_conn_zone $server_name zone=global_connections:1m;

    upstream v1 { zone v1 64k; server api-v1:8000 resolve; }
    upstream v2 { zone v2 64k; server api-v2:8001 resolve; }

    server {
        listen 8080;
        server_name _;
        client_max_body_size 16m;
        client_body_timeout 15s;
        client_header_timeout 10s;
        keepalive_timeout 15s;
        send_timeout 30s;
        proxy_connect_timeout 3s;
        proxy_read_timeout 25s;
        proxy_send_timeout 25s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_store off;
        proxy_max_temp_file_size 0;
        proxy_next_upstream off;
        proxy_ignore_client_abort off;
        proxy_intercept_errors off;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;

        error_page 400 411 414 431 494 = @invalid_request;
        error_page 404 = @not_found;
        error_page 408 = @request_timeout;
        error_page 413 = @too_large;
        error_page 429 503 = @busy;
        error_page 500 = @internal_error;
        error_page 502 = @unavailable;
        error_page 504 = @timeout;

        location = / { proxy_pass http://v1; }
        location = /ready { proxy_pass http://v1; }
        location = /info { proxy_pass http://v1; }
        location = /v2/ready { proxy_pass http://v2/ready; }
        location = /v1/protect {
            limit_req zone=per_client burst=2 nodelay;
            limit_req zone=global_requests burst=4 nodelay;
            limit_req_status 503;
            limit_conn client_connections 2;
            limit_conn global_connections 8;
            limit_conn_status 503;
            proxy_pass http://v1;
        }
        location = /v2/photo/protect {
            limit_req zone=per_client burst=2 nodelay;
            limit_req zone=global_requests burst=4 nodelay;
            limit_req_status 429;
            limit_conn client_connections 2;
            limit_conn global_connections 8;
            limit_conn_status 429;
            # A location-level error_page replaces the whole inherited list.
            error_page 400 411 414 431 494 = @invalid_request;
            error_page 404 = @not_found;
            error_page 408 = @request_timeout;
            error_page 413 = @too_large;
            error_page 429 = @v2_busy;
            error_page 500 = @internal_error;
            error_page 502 = @unavailable;
            error_page 503 = @busy;
            error_page 504 = @v2_timeout;
            # V2's existing 600s app deadline is preserved. This does not extend
            # Cloudflare's edge timeout; real AI requires a new measured review.
            proxy_read_timeout 630s;
            proxy_send_timeout 30s;
            proxy_pass http://v2;
        }
        location / { return 404; }
        location @invalid_request { return 400 '{"request_id":"","code":"INVALID_REQUEST","message":"Invalid HTTP request.","retryable":false}'; }
        location @not_found { return 404 '{"request_id":"","code":"NOT_FOUND","message":"API not found.","retryable":false}'; }
        location @request_timeout { return 408 '{"request_id":"","code":"REQUEST_TIMEOUT","message":"Request timed out.","retryable":true}'; }
        location @too_large { return 413 '{"request_id":"","code":"IMAGE_TOO_LARGE","message":"Request body is too large.","retryable":false}'; }
        location @busy { return 503 '{"request_id":"","code":"SERVER_BUSY","message":"Server is busy.","retryable":true}'; }
        location @v2_busy { return 429 '{"request_id":"","code":"PROCESSOR_BUSY","message":"Server is busy.","retryable":true}'; }
        location @v2_timeout { return 504 '{"request_id":"","code":"PROCESSOR_TIMEOUT","message":"Backend timed out.","retryable":true}'; }
        location @internal_error { return 500 '{"request_id":"","code":"INTERNAL_SERVER_ERROR","message":"Proxy internal error.","retryable":true}'; }
        location @unavailable { return 503 '{"request_id":"","code":"PROCESSOR_UNAVAILABLE","message":"Backend is unavailable.","retryable":true}'; }
        location @timeout { return 504 '{"request_id":"","code":"PROCESSING_TIMEOUT","message":"Backend timed out.","retryable":true}'; }
    }
}
