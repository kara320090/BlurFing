name: blurfing

x-api: &api
  build:
    context: .
  image: blurfing-backend:${BLURFING_RELEASE:-local}
  init: true
  restart: unless-stopped
  read_only: true
  user: "10001:10001"
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:rw,noexec,nosuid,size=256m,mode=1777"]
  networks: [application]
  mem_limit: 1g
  pids_limit: 128
  stop_grace_period: 60s
  logging:
    driver: local
    options:
      max-size: "5m"
      max-file: "2"

services:
  api-v1:
    <<: *api
    environment:
      BLURFING_DEPLOY_MODE: ${BLURFING_DEPLOY_MODE:-mock}
      BLURFING_PROCESSOR: ${BLURFING_PROCESSOR:-}
      BLURFING_MOCK_DELAY_SECONDS: ${BLURFING_MOCK_DELAY_SECONDS:-0}
      BLURFING_PROCESSOR_TIMEOUT_SECONDS: ${BLURFING_PROCESSOR_TIMEOUT_SECONDS:-20}
      BLURFING_MAX_PENDING_PROCESSOR_REQUESTS: ${BLURFING_MAX_PENDING_PROCESSOR_REQUESTS:-4}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  api-v2:
    <<: *api
    command: [python, -m, uvicorn, "deployment_photo_main:app", --host, 0.0.0.0, --port, "8001", --workers, "1", --no-access-log, --no-proxy-headers, --log-level, critical, --timeout-graceful-shutdown, "30"]
    environment:
      BLURFING_PHOTO_PYTHON: ${BLURFING_PHOTO_PYTHON:-}
      BLURFING_PHOTO_BRIDGE: ${BLURFING_PHOTO_BRIDGE:-}
      BLURFING_PHOTO_CONSUMED_REGISTRY: ${BLURFING_PHOTO_CONSUMED_REGISTRY:-}
      BLURFING_PHOTO_MODEL: ${BLURFING_PHOTO_MODEL:-}
      BLURFING_PHOTO_ENGINES: ${BLURFING_PHOTO_ENGINES:-native_v12}
      BLURFING_PHOTO_TIMEOUT_SECONDS: ${BLURFING_PHOTO_TIMEOUT_SECONDS:-600}
      BLURFING_PHOTO_DEVELOPMENT_REPLAY: ${BLURFING_PHOTO_DEVELOPMENT_REPLAY:-false}
      BLURFING_PHOTO_TEMP_ROOT: /tmp
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  nginx:
    image: nginx:stable-alpine@sha256:970364228b1e4f932abc22d321932816782cca8a20b85a77552a7cfe9acfb3b5
    entrypoint: [nginx]
    command: [-g, "daemon off;"]
    user: "101:101"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=256m,mode=1777"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:${BLURFING_HTTP_PORT:-8080}:8080"
    networks: [application, tunnel]
    depends_on:
      api-v1: {condition: service_healthy}
      api-v2: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    pids_limit: 32
    stop_grace_period: 30s
    logging:
      driver: local
      options: {max-size: "5m", max-file: "2"}

  tunnel:
    profiles: [public]
    image: cloudflare/cloudflared:latest@sha256:a15a3b50b8dabd57ac2090e9484c0247dba9dfa1f0df4d298d4317f9d69eb2d5
    command: [tunnel, --no-autoupdate, --protocol, http2, --url, "http://nginx:8080"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m,mode=1777"]
    networks: [tunnel]
    depends_on:
      nginx: {condition: service_healthy}
    mem_limit: 256m
    pids_limit: 64
    logging:
      driver: local
      options: {max-size: "5m", max-file: "2"}

networks:
  application:
    internal: true
  tunnel: {}
